name: Goji Postgame

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Postgame execution mode
        required: true
        default: AUDIT
        type: choice
        options:
          - AUDIT
          - LIVE
      slate_id:
        description: Optional GENOME slate id
        required: false
        type: string

permissions:
  contents: read

jobs:
  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOJI_POSTGAME_MODE: AUDIT
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run postgame audit
        run: python scripts/goji_postgame.py

  manual-postgame:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOJI_POSTGAME_MODE: ${{ inputs.mode }}
      GOJI_SLATE_ID: ${{ inputs.slate_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run postgame worker
        run: python scripts/goji_postgame.py
